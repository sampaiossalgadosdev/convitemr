<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Você recebeu um convite · MR 15</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icone-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icone-192.png?v=2">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
  <meta name="description" content="Convite para os 15 anos de MR · 23.01.2027 às 18:00h">
  <meta property="og:title" content="Você recebeu um convite · MR 15">
  <meta property="og:description" content="23.01.2027 às 18:00h · Clique para abrir">
  <meta property="og:image" content="/assets/envelope.jpg">
  <meta name="theme-color" content="#eef4fa">
  <link rel="preload" href="/assets/convite.jpg" as="image">
  <link rel="stylesheet" href="/style.css?v=6">
</head>
<body>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <!-- 3) Imagem estática final (fica por baixo) -->
      <img class="layer" id="estatico" src="/assets/convite.jpg" alt="MR 15 - 23.01.2027 às 18:00h">

      <!-- 2) Vídeo da abertura -->
      <video class="layer" id="video" src="/assets/abertura.mp4" muted playsinline preload="auto"></video>

      <!-- 1) Envelope (fica por cima) -->
      <img class="layer" id="envelope" src="/assets/envelope.jpg" alt="Você recebeu um convite - clique no convite para abrir" style="cursor:pointer">

      <!-- Áreas clicáveis da imagem estática -->
      <div class="hotspots hidden" id="hotspots">
        <a class="hotspot" id="btnMaps" target="_blank" rel="noopener" aria-label="Localização no maps"
           style="left:26.5%; width:15%; top:62%; height:13%"></a>
        <a class="hotspot" href="/confirmar" aria-label="Confirme sua presença"
           style="left:42%; width:15.6%; top:62%; height:13%"></a>
        <a class="hotspot" id="btnPresentes" target="_blank" rel="noopener" aria-label="Sugestões de presentes"
           style="left:58.2%; width:15.6%; top:62%; height:13%"></a>
      </div>

      <!-- Tela de confirmação: abre aqui mesmo, sem trocar de página (a música não para) -->
      <div class="tela-confirmar hidden" id="telaConfirmar" aria-hidden="true" inert>
        <img class="layer" src="/assets/fundo.jpg" alt="">
        <form class="form-box" id="form" autocomplete="on">
          <h1>Confirme sua presença</h1>
          <p>23.01.2027 · 18:00h</p>

          <label for="nome">Nome:</label>
          <input id="nome" name="nome" type="text" placeholder="Digite seu nome" maxlength="120" required autocomplete="name">

          <button class="btn" type="submit" id="btn">Confirmar presença</button>
          <div class="msg" id="msg"></div>

          <a class="link-voltar" id="voltarConvite" href="/?aberto=1">← Voltar ao convite</a>
        </form>
      </div>

      <div class="toast" id="toast"></div>

    </div>
  </div>

  <script>
    // ===== Configurações fáceis de editar =====
    const CONFIG = {
      // Endereço que abre no Google Maps (troque pelo endereço exato do salão quando tiver)
      localizacao: 'Abatiá, PR',
      // Link da lista de presentes (deixe vazio para mostrar "Em breve")
      presentes: ''
    };

    const envelope = document.getElementById('envelope');
    const video = document.getElementById('video');
    const hotspots = document.getElementById('hotspots');
    const toast = document.getElementById('toast');

    document.getElementById('btnMaps').href =
      'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONFIG.localizacao);

    const btnPresentes = document.getElementById('btnPresentes');
    if (CONFIG.presentes) {
      btnPresentes.href = CONFIG.presentes;
    } else {
      btnPresentes.href = '#';
      btnPresentes.addEventListener('click', (e) => {
        e.preventDefault();
        toast.textContent = 'Lista de presentes em breve 💙';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
    }

    let aberto = false;

    function mostrarConviteFinal() {
      video.classList.add('hidden');
      hotspots.classList.remove('hidden');
    }

    function abrir() {
      if (aberto) return;
      aberto = true;
      envelope.style.cursor = 'default';
      video.currentTime = 0;
      const p = video.play();
      envelope.classList.add('hidden'); // envelope desaparece suavemente sobre o início do vídeo
      if (p && p.catch) p.catch(() => mostrarConviteFinal()); // se o vídeo falhar, vai direto pro convite
    }

    video.addEventListener('ended', mostrarConviteFinal);
    video.addEventListener('error', () => { if (aberto) mostrarConviteFinal(); });
    envelope.addEventListener('click', abrir);

    // Quem volta da página de confirmação (link "Voltar" ou botão voltar do navegador)
    // cai direto no convite já aberto, sem repetir o envelope e o vídeo.
    const stage = document.getElementById('stage');
    function mostrarAbertoDireto() {
      aberto = true;
      stage.classList.add('sem-transicao');
      video.pause();
      envelope.classList.add('hidden');
      envelope.style.cursor = 'default';
      mostrarConviteFinal();
      requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('sem-transicao')));
    }

    const lerFlag = () => { try { return sessionStorage.getItem('mr15-aberto') === '1'; } catch { return false; } };
    const salvarFlag = () => { try { sessionStorage.setItem('mr15-aberto', '1'); } catch {} };
    video.addEventListener('ended', salvarFlag);
    document.querySelector('a[href="/confirmar"]').addEventListener('click', salvarFlag);

    const params = new URLSearchParams(location.search);
    const nav = performance.getEntriesByType('navigation')[0];
    const voltou = nav && nav.type === 'back_forward' && lerFlag();
    if (params.get('aberto') === '1' || voltou) {
      mostrarAbertoDireto();
      if (params.has('aberto')) history.replaceState(null, '', '/'); // não deixa o link "aberto" ser compartilhado
    }
    // Página restaurada do cache do navegador: mantém como estava (convite aberto)
    window.addEventListener('pageshow', (e) => { if (e.persisted && aberto) mostrarAbertoDireto(); });

    // ===== Tela de confirmação dentro do convite =====
    // Em vez de carregar outra página (o que corta a música), a tela aparece por cima
    // com uma transição suave. O endereço muda para /confirmar e o "voltar" do celular funciona.
    const telaConfirmar = document.getElementById('telaConfirmar');
    const TITULO_CONVITE = document.title;

    function mostrarConfirmar(mostrar) {
      telaConfirmar.classList.toggle('hidden', !mostrar);
      telaConfirmar.setAttribute('aria-hidden', String(!mostrar));
      telaConfirmar.inert = !mostrar;
      document.title = mostrar ? 'Confirme sua presença · MR 15' : TITULO_CONVITE;
      if (mostrar && !aberto) mostrarAbertoDireto(); // ao voltar, o convite já está aberto
    }

    document.querySelector('a[href="/confirmar"]').addEventListener('click', (e) => {
      e.preventDefault();
      salvarFlag();
      history.pushState({ tela: 'confirmar' }, '', '/confirmar');
      mostrarConfirmar(true);
    });

    document.getElementById('voltarConvite').addEventListener('click', (e) => {
      e.preventDefault();
      if (history.state && history.state.tela === 'confirmar') history.back();
      else { history.replaceState(null, '', '/'); mostrarConfirmar(false); }
    });

    window.addEventListener('popstate', () => {
      mostrarConfirmar(location.pathname === '/confirmar');
    });

    // Link direto para /confirmar: abre já na tela de confirmação, sem animação
    if (location.pathname === '/confirmar') {
      stage.classList.add('sem-transicao');
      mostrarConfirmar(true);
      requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('sem-transicao')));
    }

  </script>
  <script src="/confirmar.js?v=1"></script>
  <script src="/musica.js?v=4"></script>
</body>
</html>
