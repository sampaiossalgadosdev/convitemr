<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Confirme sua presença · MR 15</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icone-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icone-192.png?v=2">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#eef4fa">
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
  <div class="stage-wrap">
    <div class="stage fade-in">
      <img class="layer" src="/assets/fundo.jpg" alt="">

      <form class="form-box" id="form" autocomplete="on">
        <h1>Confirme sua presença</h1>
        <p>23.01.2027 · 18:00h</p>

        <label for="nome">Nome:</label>
        <input id="nome" name="nome" type="text" placeholder="Digite seu nome" maxlength="120" required autocomplete="name">

        <button class="btn" type="submit" id="btn">Confirmar presença</button>
        <div class="msg" id="msg"></div>

        <a class="link-voltar" href="/?aberto=1">← Voltar ao convite</a>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const nome = document.getElementById('nome');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      const valor = nome.value.trim();
      if (valor.length < 2) {
        msg.className = 'msg erro';
        msg.textContent = 'Digite seu nome completo.';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      try {
        const r = await fetch('/api/confirmar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome: valor })
        });
        const data = await r.json();
        if (!data.ok) throw new Error(data.erro || 'Erro');
        msg.textContent = data.duplicado
          ? 'Sua presença já estava confirmada 💙'
          : 'Presença confirmada! Te espero lá 💙';
        nome.value = '';
        btn.textContent = 'Confirmado ✓';
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Confirmar presença'; }, 2500);
      } catch (err) {
        msg.className = 'msg erro';
        msg.textContent = err.message || 'Não foi possível confirmar. Tente novamente.';
        btn.disabled = false;
        btn.textContent = 'Confirmar presença';
      }
    });
  </script>
  <script src="/musica.js?v=1"></script>
</body>
</html>
